<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>For Iva 🤍</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  :root {
    --bg-1: #050510;
    --bg-2: #0f0f22;
    --bg-3: #1a0b2e;
    --bot: rgba(255, 255, 255, 0.07);
    --user: linear-gradient(135deg, #a855f7, #6366f1);
    --accent: #a855f7;
    --accent-2: #6366f1;
    --accent-3: #ec4899;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --border: rgba(255, 255, 255, 0.08);
  }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, system-ui, sans-serif;
    background: var(--bg-1);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  /* ============ ANIMATED BACKGROUND ============ */
  .bg-mesh {
    position: fixed; inset: -20%;
    z-index: 0;
    pointer-events: none;
    filter: blur(80px);
    opacity: 0.7;
  }
  .bg-blob {
    position: absolute;
    border-radius: 50%;
    mix-blend-mode: screen;
    animation: drift 22s ease-in-out infinite;
  }
  .bg-blob.b1 { width: 55vw; height: 55vw; background: #7c3aed; top: -10%; left: -15%; animation-delay: 0s; }
  .bg-blob.b2 { width: 50vw; height: 50vw; background: #4f46e5; bottom: -15%; right: -15%; animation-delay: -6s; }
  .bg-blob.b3 { width: 45vw; height: 45vw; background: #db2777; top: 30%; right: 10%; animation-delay: -12s; }
  @keyframes drift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33%      { transform: translate(8vw, -6vh) scale(1.15); }
    66%      { transform: translate(-6vw, 5vh) scale(0.9); }
  }

  .grain {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    opacity: 0.35;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/%3E%3C/svg%3E");
    mix-blend-mode: overlay;
  }

  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
  .star {
    position: absolute; width: 2px; height: 2px;
    background: white; border-radius: 50%;
    animation: twinkle 4s infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.1; transform: scale(0.8); }
    50%      { opacity: 0.9; transform: scale(1.4); }
  }

  /* ============ INTRO ============ */
  .intro {
    position: relative; z-index: 5;
    text-align: center; max-width: 420px; width: 100%;
    padding: 44px 30px;
    background: rgba(15, 15, 30, 0.55);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 32px;
    box-shadow:
      0 40px 100px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.08);
    animation: fadeUp 0.9s cubic-bezier(0.22, 1.2, 0.4, 1) both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .intro .badge {
    display: inline-block; font-size: 10.5px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase;
    color: #c4b5fd;
    background: linear-gradient(135deg, rgba(168,85,247,0.2), rgba(99,102,241,0.2));
    border: 1px solid rgba(168,85,247,0.3);
    padding: 7px 16px; border-radius: 20px; margin-bottom: 22px;
    animation: badgePulse 3s ease-in-out infinite;
  }
  @keyframes badgePulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(168,85,247,0); }
    50%      { box-shadow: 0 0 24px 2px rgba(168,85,247,0.35); }
  }

  .intro .icon-wrap {
    font-size: 68px; margin-bottom: 14px;
    display: inline-block;
    animation: floatY 3.5s ease-in-out infinite;
    filter: drop-shadow(0 12px 30px rgba(168,85,247,0.5));
  }
  @keyframes floatY {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-12px) rotate(3deg); }
  }

  .intro h1 {
    font-size: 30px; font-weight: 800; letter-spacing: -0.8px;
    margin-bottom: 16px; line-height: 1.15;
    background: linear-gradient(135deg, #c4b5fd, #818cf8, #f0abfc);
    background-size: 200% 200%;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    animation: gradShift 5s ease infinite;
  }
  @keyframes gradShift {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  .intro p {
    font-size: 15px; color: var(--muted);
    line-height: 1.7; margin-bottom: 30px; font-weight: 400;
  }

  .start-btn {
    position: relative; overflow: hidden;
    border: none; cursor: pointer; font-family: inherit;
    font-size: 15.5px; font-weight: 700; color: white;
    padding: 17px 44px; border-radius: 50px;
    background: linear-gradient(135deg, #a855f7, #6366f1);
    box-shadow:
      0 12px 36px rgba(168,85,247,0.5),
      inset 0 1px 0 rgba(255,255,255,0.25);
    transition: transform 0.2s, box-shadow 0.3s;
    letter-spacing: 0.3px;
  }
  .start-btn::before {
    content:''; position:absolute; inset:0;
    background: linear-gradient(135deg, #ec4899, #a855f7, #6366f1);
    opacity:0; transition: opacity 0.4s;
  }
  .start-btn::after {
    content:''; position:absolute; inset:-50%;
    background: radial-gradient(circle, rgba(255,255,255,0.4), transparent 60%);
    transform: scale(0); opacity:0;
    transition: transform 0.6s, opacity 0.6s;
  }
  .start-btn:hover::before { opacity:1; }
  .start-btn:hover::after { transform: scale(1.5); opacity:1; }
  .start-btn:active { transform: scale(0.95); }
  .start-btn span { position: relative; z-index: 2; }

  /* ============ PHONE ============ */
  .phone {
    display: none; position: relative; z-index: 5;
    width: 100%; max-width: 430px;
    height: min(94vh, 860px);
    background: rgba(10, 10, 22, 0.7);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 32px;
    overflow: hidden;
    box-shadow:
      0 40px 100px rgba(0,0,0,0.7),
      inset 0 1px 0 rgba(255,255,255,0.06);
    flex-direction: column;
    animation: phoneIn 0.7s cubic-bezier(0.22, 1.2, 0.4, 1) both;
  }
  @keyframes phoneIn {
    from { opacity: 0; transform: scale(0.9) translateY(20px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  .phone.show { display: flex; }

  /* ============ HEADER ============ */
  .header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: rgba(15, 15, 30, 0.5);
    backdrop-filter: blur(20px);
    flex-shrink: 0;
    position: relative; z-index: 10;
  }

  .avatar {
    position: relative;
    width: 42px; height: 42px; border-radius: 50%;
    background: linear-gradient(135deg, #a855f7, #6366f1);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; color: white;
    flex-shrink: 0;
    box-shadow: 0 4px 16px rgba(168,85,247,0.4);
  }
  .avatar::after {
    content:''; position:absolute; inset:-3px;
    border-radius:50%;
    border: 2px solid rgba(168,85,247,0.4);
    animation: avatarPulse 2.5s ease-in-out infinite;
  }
  @keyframes avatarPulse {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50%      { transform: scale(1.12); opacity: 0; }
  }

  .header-info { flex: 1; }
  .header-info .name {
    font-size: 14.5px; font-weight: 700; line-height: 1.3;
    display: flex; align-items: center; gap: 6px;
  }
  .verified {
    font-size: 11px; color: #60a5fa;
    filter: drop-shadow(0 0 4px rgba(96,165,250,0.6));
  }
  .header-info .status {
    font-size: 11px; color: #4ade80;
    display: flex; align-items: center; gap: 5px;
    margin-top: 2px;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.5); }
    70%  { box-shadow: 0 0 0 7px rgba(74, 222, 128, 0); }
    100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
  }

  .sound-toggle {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.04);
    color: var(--muted);
    font-size: 15px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .sound-toggle:hover {
    background: rgba(168,85,247,0.15);
    border-color: rgba(168,85,247,0.4);
    color: #c4b5fd;
  }
  .sound-toggle:active { transform: scale(0.9); }
  .sound-toggle.muted { color: #ef4444; }

  /* ============ CHAT ============ */
  .chat {
    flex: 1; overflow-y: auto;
    padding: 18px 16px;
    display: flex; flex-direction: column; gap: 10px;
    scroll-behavior: smooth;
    position: relative;
  }
  .chat::-webkit-scrollbar { width: 4px; }
  .chat::-webkit-scrollbar-thumb {
    background: rgba(168,85,247,0.3); border-radius: 4px;
  }

  .msg {
    max-width: 82%;
    padding: 11px 15px;
    border-radius: 20px;
    font-size: 14.5px;
    line-height: 1.5;
    word-wrap: break-word;
    position: relative;
    animation: bubbleIn 0.4s cubic-bezier(0.22, 1.2, 0.4, 1) both;
  }
  @keyframes bubbleIn {
    from { opacity: 0; transform: translateY(12px) scale(0.92); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .msg.bot {
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.05);
    align-self: flex-start;
    border-bottom-left-radius: 6px;
    color: var(--text);
  }
  .msg.user {
    background: linear-gradient(135deg, #a855f7, #6366f1);
    align-self: flex-end;
    border-bottom-right-radius: 6px;
    color: white;
    box-shadow: 0 6px 20px rgba(168,85,247,0.3);
  }

  .msg.bot .reaction {
    position: absolute;
    bottom: -10px; right: -8px;
    font-size: 16px;
    animation: reactPop 0.5s cubic-bezier(0.22, 1.5, 0.4, 1) both;
  }
  @keyframes reactPop {
    0% { transform: scale(0) rotate(-45deg); }
    70% { transform: scale(1.3) rotate(10deg); }
    100% { transform: scale(1) rotate(0); }
  }

  /* Typing indicator */
  .typing {
    align-self: flex-start;
    padding: 14px 18px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 20px 20px 20px 6px;
    display: flex; gap: 5px;
    animation: bubbleIn 0.3s ease both;
  }
  .typing span {
    width: 8px; height: 8px; border-radius: 50%;
    background: linear-gradient(135deg, #a855f7, #6366f1);
    animation: dotBounce 1.4s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes dotBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30%           { transform: translateY(-6px); opacity: 1; }
  }

  /* ============ REPLY AREA ============ */
  .reply-area {
    flex-shrink: 0;
    padding: 12px 16px 18px;
    border-top: 1px solid var(--border);
    background: rgba(10, 10, 22, 0.7);
    backdrop-filter: blur(20px);
    display: flex; flex-direction: column; gap: 8px;
    animation: fadeUp 0.4s cubic-bezier(0.22, 1.2, 0.4, 1) both;
    position: relative;
    max-height: 45%;
    overflow-y: auto;
  }
  .reply-area.hidden { display: none; }
  .reply-area::-webkit-scrollbar { width: 3px; }
  .reply-area::-webkit-scrollbar-thumb { background: rgba(168,85,247,0.3); }

  .opt-btn {
    position: relative; overflow: hidden;
    width: 100%;
    border: 1.5px solid rgba(168,85,247,0.25);
    background: rgba(168,85,247,0.06);
    color: var(--text);
    font-family: inherit;
    font-size: 14px; font-weight: 500;
    padding: 14px 18px;
    border-radius: 16px;
    cursor: pointer;
    text-align: center;
    transition: all 0.25s cubic-bezier(0.22, 1.2, 0.4, 1);
    line-height: 1.4;
  }
  .opt-btn:hover {
    background: rgba(168,85,247,0.15);
    border-color: rgba(168,85,247,0.5);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(168,85,247,0.2);
  }
  .opt-btn:active { transform: scale(0.97) translateY(0); }

  .opt-btn.special {
    background: linear-gradient(135deg, rgba(168,85,247,0.25), rgba(236,72,153,0.25));
    border-color: rgba(236,72,153,0.5);
    font-weight: 700;
    font-size: 14.5px;
    animation: specialGlow 2.4s ease-in-out infinite;
  }
  @keyframes specialGlow {
    0%, 100% {
      box-shadow: 0 0 0 0 rgba(236,72,153,0);
      border-color: rgba(236,72,153,0.4);
    }
    50% {
      box-shadow: 0 0 28px 4px rgba(236,72,153,0.45);
      border-color: rgba(236,72,153,0.9);
    }
  }
  .opt-btn.special:hover {
    background: linear-gradient(135deg, rgba(168,85,247,0.4), rgba(236,72,153,0.4));
  }

  /* input */
  .input-wrap {
    display: flex; gap: 8px; align-items: flex-end;
    background: rgba(255,255,255,0.04);
    border: 1.5px solid var(--border);
    border-radius: 22px;
    padding: 6px 6px 6px 18px;
    transition: border-color 0.25s, box-shadow 0.25s;
  }
  .input-wrap:focus-within {
    border-color: rgba(168,85,247,0.6);
    box-shadow: 0 0 0 4px rgba(168,85,247,0.12);
  }
  .input-wrap input {
    flex: 1;
    background: transparent; border: none; outline: none;
    color: var(--text);
    font-family: inherit; font-size: 14.5px;
    padding: 8px 0;
  }
  .input-wrap input::placeholder { color: #64748b; }

  .send-btn {
    position: relative; overflow: hidden;
    width: 38px; height: 38px; border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #a855f7, #6366f1);
    color: white; font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s;
    flex-shrink: 0;
    box-shadow: 0 4px 14px rgba(168,85,247,0.4);
  }
  .send-btn:active { transform: scale(0.88); }

  /* ============ CONFETTI & FX ============ */
  .confetti {
    position: fixed;
    z-index: 200;
    pointer-events: none;
    will-change: transform;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(900deg); opacity: 0; }
  }

  .heart-fx {
    position: fixed;
    font-size: 26px;
    z-index: 200;
    pointer-events: none;
    animation: heartFloat 3s ease-out forwards;
  }
  @keyframes heartFloat {
    0%   { transform: translateY(0) scale(0.4); opacity: 0; }
    20%  { transform: translateY(-40px) scale(1.1); opacity: 1; }
    100% { transform: translateY(-260px) scale(0.9); opacity: 0; }
  }

  .shake { animation: shakeScreen 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97); }
  @keyframes shakeScreen {
    10%, 90% { transform: translate3d(-2px, 0, 0); }
    20%, 80% { transform: translate3d(4px, 0, 0); }
    30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
    40%, 60% { transform: translate3d(6px, 0, 0); }
  }

  /* flash */
  .flash {
    position: fixed; inset: 0; z-index: 300;
    background: radial-gradient(circle, rgba(255,255,255,0.9), transparent 70%);
    pointer-events: none;
    opacity: 0;
    animation: flashAnim 0.7s ease-out forwards;
  }
  @keyframes flashAnim {
    0% { opacity: 0; }
    20% { opacity: 1; }
    100% { opacity: 0; }
  }

  @media (max-width: 400px) {
    .intro { padding: 34px 22px; }
    .intro h1 { font-size: 25px; }
    .intro .icon-wrap { font-size: 56px; }
    .header-info .name { font-size: 14px; }
  }
</style>
</head>
<body>

<div class="bg-mesh">
  <div class="bg-blob b1"></div>
  <div class="bg-blob b2"></div>
  <div class="bg-blob b3"></div>
</div>
<div class="grain"></div>
<div class="stars" id="stars"></div>

<!-- ================= INTRO ================= -->
<div class="intro" id="intro">
  <div class="badge">✧ A MESSAGE FROM JEJE ✧</div>
  <div class="icon-wrap">💌</div>
  <h1>Hey Iva... got 10 questions for you</h1>
  <p>No right or wrong answers. Just be honest with me, yeah?</p>
  <button class="start-btn" id="startBtn"><span>Let's do this →</span></button>
</div>

<!-- ================= PHONE ================= -->
<div class="phone" id="phone">
  <div class="header">
    <div class="avatar">J</div>
    <div class="header-info">
      <div class="name">Jeremy (JeJe) <span class="verified">✓</span></div>
      <div class="status"><span class="dot"></span> <span id="statusText">online</span></div>
    </div>
    <button class="sound-toggle" id="soundToggle" title="Sound on/off">🔊</button>
  </div>
  <div class="chat" id="chat"></div>
  <div class="reply-area hidden" id="replyArea"></div>
</div>

<script>
/* ================== STARS ================== */
(function() {
  const wrap = document.getElementById('stars');
  for (let i = 0; i < 70; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.width = s.style.height = (1 + Math.random() * 2) + 'px';
    s.style.animationDelay = Math.random() * 4 + 's';
    s.style.animationDuration = (2 + Math.random() * 4) + 's';
    wrap.appendChild(s);
  }
})();

/* ================== AUDIO ENGINE ================== */
let audioCtx;
let soundOn = true;

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function tone(freq, duration, type = 'sine', vol = 0.05, delay = 0, freqEnd = null) {
  if (!soundOn || !audioCtx) return;
  const t = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, t + duration);
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(vol, t + 0.008);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
  osc.start(t); osc.stop(t + duration + 0.05);
}

function noise(duration = 0.1, vol = 0.03, delay = 0) {
  if (!soundOn || !audioCtx) return;
  const t = audioCtx.currentTime + delay;
  const bufferSize = audioCtx.sampleRate * duration;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.value = 1200;
  src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
  src.start(t); src.stop(t + duration + 0.05);
}

// SFX library
const SFX = {
  incoming() {
    tone(880, 0.08, 'sine', 0.035, 0);
    tone(1320, 0.14, 'sine', 0.028, 0.05);
  },
  send() {
    tone(620, 0.06, 'triangle', 0.04, 0);
    tone(920, 0.1, 'triangle', 0.035, 0.045);
    noise(0.08, 0.015, 0);
  },
  typingTick() {
    tone(1400 + Math.random() * 400, 0.015, 'square', 0.008);
  },
  button() {
    tone(700, 0.05, 'sine', 0.045, 0);
    tone(1100, 0.09, 'sine', 0.03, 0.035);
  },
  pop() {
    tone(500, 0.1, 'sine', 0.05, 0, 900);
  },
  heart() {
    tone(1050, 0.15, 'sine', 0.05, 0);
    tone(1400, 0.18, 'sine', 0.04, 0.08);
    tone(1750, 0.25, 'sine', 0.03, 0.16);
  },
  celebration() {
    // Big major chord + arpeggio
    const notes = [523.25, 659.25, 783.99, 1046.5, 1318.51];
    notes.forEach((n, i) => tone(n, 0.5, 'sine', 0.06, i * 0.09));
    // Sparkle
    setTimeout(() => {
      for (let i = 0; i < 8; i++) {
        tone(1500 + Math.random() * 1500, 0.15, 'sine', 0.03, i * 0.07);
      }
    }, 500);
    // Bass
    tone(130.81, 0.9, 'sine', 0.05, 0);
  },
  whoosh() {
    noise(0.3, 0.04, 0);
    tone(300, 0.3, 'sine', 0.03, 0, 100);
  },
  wow() {
    tone(440, 0.12, 'sine', 0.05, 0);
    tone(660, 0.12, 'sine', 0.05, 0.1);
    tone(880, 0.25, 'sine', 0.05, 0.2);
  }
};

function vibrate(pattern) {
  if (navigator.vibrate && soundOn) navigator.vibrate(pattern);
}

/* ================== HELPERS ================== */
const chatEl = document.getElementById('chat');
const replyArea = document.getElementById('replyArea');
const statusText = document.getElementById('statusText');
const sleep = ms => new Promise(r => setTimeout(r, ms));

function scrollChat() { chatEl.scrollTop = chatEl.scrollHeight; }

function addMsg(text, who, reaction = null) {
  const el = document.createElement('div');
  el.className = 'msg ' + who;
  el.textContent = text;
  if (reaction) {
    const r = document.createElement('span');
    r.className = 'reaction';
    r.textContent = reaction;
    el.appendChild(r);
  }
  chatEl.appendChild(el);
  scrollChat();
  return el;
}

function showTyping() {
  const el = document.createElement('div');
  el.className = 'typing';
  el.id = 'typingInd';
  el.innerHTML = '<span></span><span></span><span></span>';
  chatEl.appendChild(el);
  scrollChat();
  statusText.textContent = 'typing...';
  // typing tick loop
  let ticks = 0;
  const iv = setInterval(() => {
    SFX.typingTick();
    ticks++;
    if (ticks > 20) clearInterval(iv);
  }, 130);
  el._tickIv = iv;
}

function hideTyping() {
  const el = document.getElementById('typingInd');
  if (el) {
    if (el._tickIv) clearInterval(el._tickIv);
    el.remove();
  }
  statusText.textContent = 'online';
}

function clearReply() {
  replyArea.innerHTML = '';
  replyArea.classList.add('hidden');
}

function showOptions(options) {
  replyArea.innerHTML = '';
  replyArea.classList.remove('hidden');

  options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn' + (opt.special ? ' special' : '');
    btn.textContent = opt.text;
    btn.style.animation = `fadeUp 0.4s cubic-bezier(0.22,1.2,0.4,1) ${i * 0.07}s both`;
    btn.addEventListener('click', () => {
      initAudio();
      SFX.button();
      vibrate(12);
      clearReply();
      addMsg(opt.text, 'user');
      SFX.send();
      setTimeout(() => runNode(opt.next), 550);
    });
    replyArea.appendChild(btn);
  });
}

function showInput(placeholder, next, reaction) {
  replyArea.innerHTML = '';
  replyArea.classList.remove('hidden');

  const wrap = document.createElement('div');
  wrap.className = 'input-wrap';

  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = placeholder || 'Type here...';

  const sendBtn = document.createElement('button');
  sendBtn.className = 'send-btn';
  sendBtn.innerHTML = '➤';

  wrap.appendChild(input);
  wrap.appendChild(sendBtn);
  replyArea.appendChild(wrap);

  const submit = () => {
    const val = input.value.trim();
    if (!val) {
      input.style.animation = 'shakeScreen 0.4s';
      setTimeout(() => input.style.animation = '', 400);
      return;
    }
    initAudio();
    SFX.button();
    vibrate(15);
    clearReply();
    addMsg(val, 'user');
    SFX.send();
    setTimeout(() => runNode(next, reaction), 550);
  };

  sendBtn.addEventListener('click', submit);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  setTimeout(() => input.focus(), 220);
}

async function runNode(id, userReaction = null) {
  const node = nodes[id];
  if (!node) return;

  // small pause after user's reply
  if (userReaction === null && id !== 'q1') {
    await sleep(250);
  }

  for (let i = 0; i < node.msgs.length; i++) {
    const text = node.msgs[i];
    await sleep(420);
    showTyping();
    const typeTime = Math.min(1500, 350 + text.length * 16);
    await sleep(typeTime);
    hideTyping();

    // last message may carry a reaction
    const react = (i === node.msgs.length - 1 && node.reaction) ? node.reaction : null;
    addMsg(text, 'bot', react);
    SFX.incoming();
    vibrate(8);
    if (react) setTimeout(() => SFX.heart(), 250);
    await sleep(240);
  }

  if (node.ending) {
    if (node.celebration) {
      setTimeout(() => {
        SFX.celebration();
        burstCelebration();
        vibrate([50, 30, 50, 30, 120]);
      }, 350);
    }
    return;
  }

  await sleep(280);

  if (node.input) {
    showInput(node.placeholder, node.next, node.reaction);
  } else if (node.options) {
    showOptions(node.options);
  }
}

/* ================== CELEBRATION FX ================== */
function burstCelebration() {
  // screen flash
  const flash = document.createElement('div');
  flash.className = 'flash';
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 800);

  // shake
  document.body.classList.add('shake');
  setTimeout(() => document.body.classList.remove('shake'), 650);

  // confetti
  const colors = ['#a855f7','#6366f1','#ec4899','#f472b6','#fbbf24','#34d399','#60a5fa','#c4b5fd'];
  for (let i = 0; i < 140; i++) {
    setTimeout(() => {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.top = '-20px';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      const size = 6 + Math.random() * 10;
      c.style.width = size + 'px';
      c.style.height = (size * (0.4 + Math.random() * 0.8)) + 'px';
      c.style.borderRadius = Math.random() > 0.6 ? '50%' : '2px';
      c.style.boxShadow = `0 0 12px ${c.style.background}`;
      const dur = 2.2 + Math.random() * 2.5;
      c.style.animation = `confettiFall ${dur}s linear forwards`;
      document.body.appendChild(c);
      setTimeout(() => c.remove(), dur * 1000 + 200);
    }, i * 18);
  }

  // floating hearts
  const hearts = ['🤍','💜','💖','✨','💫','💕'];
  for (let i = 0; i < 30; i++) {
    setTimeout(() => {
      const h = document.createElement('div');
      h.className = 'heart-fx';
      h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      h.style.left = Math.random() * 100 + 'vw';
      h.style.bottom = '-20px';
      const dur = 2.5 + Math.random() * 2;
      h.style.animation = `heartFloat ${dur}s ease-out forwards`;
      document.body.appendChild(h);
      setTimeout(() => h.remove(), dur * 1000 + 200);
    }, i * 90);
  }

  // continuous sparkle loop for a few seconds
  let sparkleCount = 0;
  const sparkleInt = setInterval(() => {
    SFX.typingTick();
    sparkleCount++;
    if (sparkleCount > 30) clearInterval(sparkleInt);
  }, 120);
}

const soundToggle = document.getElementById('soundToggle');
soundToggle.addEventListener('click', () => {
  soundOn = !soundOn;
  soundToggle.textContent = soundOn ? '🔊' : '🔇';
  soundToggle.classList.toggle('muted', !soundOn);
  if (soundOn) {
    initAudio();
    SFX.pop();
  }
});

startBtn.addEventListener('click', async () => {
  initAudio();
  SFX.whoosh();
  vibrate(20);

  introEl.style.transition = 'opacity 0.55s cubic-bezier(0.4,0,0.2,1), transform 0.55s cubic-bezier(0.4,0,0.2,1)';

  introEl.style.display = 'none';
  phoneEl.classList.add('show');

  SFX.pop();
  setTimeout(() => SFX.wow(), 200);

  await sleep(500);
  runNode('q1');
});

/* Prevent iOS double-tap zoom */
let lastTouch = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouch <= 300) e.preventDefault();
  lastTouch = now;
}, { passive: false });
